server.port=${PORT:8080}
server.servlet.context-path=/

# App Name & Metadata
spring.application.name=kizunaa-backend

# Database Configuration (Defaults to in-memory H2 with MySQL syntax emulation for zero-setup start;
# can be overridden with MySQL environment variables SPRING_DATASOURCE_URL, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kizunaadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
kizunaa.jwt.secret=${JWT_SECRET:KizunaaSuperSecretKeyForJwtTokenAuthentication2026SecureStringWith256BitsMinimum!}
kizunaa.jwt.expiration-ms=86400000

# AI Configuration (Optional Gemini / OpenAI key)
kizunaa.ai.api-key=${AI_API_KEY:}
kizunaa.ai.provider=${AI_PROVIDER:heuristic}

# Logging
logging.level.com.kizunaa=INFO
logging.level.org.springframework.security=WARN
